name: Presentation Coach CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # Job 1: Lint and Run Pytest Suite
  # ==========================================================
  lint-and-test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt flake8

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Lint Code (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        env:
          MONGO_URI: mongodb://localhost:27017/presentation_coach_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          FLASK_ENV: testing
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=pytest-results.xml

      - name: Upload Test Results and Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-and-coverage-reports
          path: |
            coverage.xml
            htmlcov/
            pytest-results.xml

  # ==========================================================
  # Job 2: Deploy to AWS EC2 via Git Pull + Docker Compose Build
  # MongoDB and Redis are managed by Docker Compose containers.
  # No Docker Hub or external MongoDB needed.
  # ==========================================================
  deploy:
    name: Deploy to AWS EC2
    environment: 'deploy to aws'
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Write .env Files and Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # ── Required secrets ──────────────────────────────────────────────
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          APP_SCHEME: ${{ secrets.APP_SCHEME }}
          # ── Optional secrets (leave empty in GitHub if not used) ──────────
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          # ── Build metadata ────────────────────────────────────────────────
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: https://github.com/MR-WHOAMEYE/AI-POWERED-PRESENTATION-COACH-FOR-BOOSTING-SPEAKER.git
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GEMINI_API_KEY,CLOUDINARY_URL,BLOB_READ_WRITE_TOKEN,ELEVENLABS_API_KEY,GOOGLE_CLOUD_PROJECT,FIREBASE_SERVICE_ACCOUNT_KEY,EC2_HOST,DOMAIN_NAME,BACKEND_URL,APP_SCHEME,COMMIT_SHA,REPO_URL
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Deploying commit $COMMIT_SHA on AWS EC2..."

            # ── 1. Install Docker if missing ────────────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # Ensure Docker daemon is running and ubuntu user can use it
            sudo systemctl enable --now docker
            sudo usermod -aG docker ubuntu || true
            sudo chmod 666 /var/run/docker.sock || true

            # ── 2. Clone or Pull latest code from GitHub ────────────────────
            APP_DIR=~/presentation-coach

            if [ -d "$APP_DIR/.git" ]; then
              echo "📥 Repository exists — pulling latest changes..."
              cd "$APP_DIR"
              git fetch --all
              git reset --hard origin/main
            elif [ -d "$APP_DIR" ]; then
              echo "🧹 Existing directory is not a git repo — recreating it..."
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "📥 Cloning repository for the first time..."
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            echo "✅ Code is up to date at commit: $(git rev-parse --short HEAD)"

            # ── 3. Write .env files (secrets never printed to log) ──────────
            # MongoDB and Redis use Docker Compose service names (internal network)
            # Google OAuth in production strictly requires https:// and a valid domain
            if [ -n "$DOMAIN_NAME" ]; then
              APP_DOMAIN="$DOMAIN_NAME"
            else
              APP_DOMAIN="presentation-coach.duckdns.org"
            fi
            SCHEME="${APP_SCHEME:-https}"
            echo "📝 Writing environment files (domain: $APP_DOMAIN, scheme: $SCHEME)..."

            # Ensure SSL certificates are readable by Nginx container
            sudo chmod -R 755 /etc/letsencrypt || true

            ENV_FILE="$APP_DIR/.env"

            # Persist a stable SECRET_KEY across deployments
            # If the secret is not set in GitHub, generate one and save it locally
            SECRET_KEY_FILE="$HOME/.presentation_coach_secret_key"
            if [ -z "${SECRET_KEY}" ]; then
              if [ -f "$SECRET_KEY_FILE" ]; then
                SECRET_KEY=$(cat "$SECRET_KEY_FILE")
                echo "🔑 Using persisted SECRET_KEY from $SECRET_KEY_FILE"
              else
                SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
                echo "$SECRET_KEY" > "$SECRET_KEY_FILE"
                chmod 600 "$SECRET_KEY_FILE"
                echo "🔑 Generated new SECRET_KEY and persisted to $SECRET_KEY_FILE"
              fi
            fi

            > "$ENV_FILE"
            echo "MONGO_URI=mongodb://mongodb:27017/presentation_coach" >> "$ENV_FILE"
            echo "REDIS_URL=redis://redis:6379/0" >> "$ENV_FILE"
            echo "FRONTEND_URL=${SCHEME}://${APP_DOMAIN}" >> "$ENV_FILE"
            echo "SECRET_KEY=${SECRET_KEY}" >> "$ENV_FILE"
            echo "FLASK_ENV=production" >> "$ENV_FILE"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> "$ENV_FILE"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> "$ENV_FILE"
            echo "GOOGLE_REDIRECT_URI=${SCHEME}://${APP_DOMAIN}/auth/callback" >> "$ENV_FILE"
            echo "GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-presentai-7b59c}" >> "$ENV_FILE"
            echo "FIREBASE_PROJECT_ID=${GOOGLE_CLOUD_PROJECT:-presentai-7b59c}" >> "$ENV_FILE"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> "$ENV_FILE"
            echo "GEMINI_MODEL=gemini-2.5-flash" >> "$ENV_FILE"
            echo "GEMINI_ENABLE_SEARCH=false" >> "$ENV_FILE"
            echo "CLOUDINARY_URL=${CLOUDINARY_URL}" >> "$ENV_FILE"
            echo "BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}" >> "$ENV_FILE"
            echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}" >> "$ENV_FILE"

            # Write FIREBASE_SERVICE_ACCOUNT_KEY safely — collapse JSON to a single line
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
              CLEAN_KEY=$(echo "$FIREBASE_SERVICE_ACCOUNT_KEY" | tr -d '\r\n')
              echo "FIREBASE_SERVICE_ACCOUNT_KEY='$CLEAN_KEY'" >> "$ENV_FILE"
              echo "✅ FIREBASE_SERVICE_ACCOUNT_KEY written to .env"
            fi

            mkdir -p "$APP_DIR/backend"
            cp "$APP_DIR/.env" "$APP_DIR/backend/.env"

            # ── 3b. Write frontend/.env for Vite build ───────────────────────
            FRONTEND_ENV="$APP_DIR/frontend/.env"
            mkdir -p "$APP_DIR/frontend"
            > "$FRONTEND_ENV"
            echo "VITE_FIREBASE_API_KEY=AIzaSyCUxdVopXHChJrA0UnTq4VsL0fsyM1tRoA" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_AUTH_DOMAIN=presentai-7b59c.firebaseapp.com" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_PROJECT_ID=presentai-7b59c" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_STORAGE_BUCKET=presentai-7b59c.firebasestorage.app" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=789581193280" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_APP_ID=1:789581193280:web:3fa4f44b1d4a4e2780bfa5" >> "$FRONTEND_ENV"
            echo "VITE_FIREBASE_MEASUREMENT_ID=G-X8RPMY8R6L" >> "$FRONTEND_ENV"
            echo "VITE_API_URL=${BACKEND_URL:-${SCHEME}://${APP_DOMAIN}}" >> "$FRONTEND_ENV"

            # Secure env files — owner read-only
            chmod 600 "$APP_DIR/.env" "$APP_DIR/backend/.env" "$FRONTEND_ENV"

            echo "✅ .env files written for backend and frontend." 

            # ── 4. Build images locally and restart services ─────────────────
            cd "$APP_DIR"
            echo "🔨 Building and starting containers..."

            if [ -f "docker-compose.prod.yml" ]; then
              sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            else
              sudo docker compose up -d --build --remove-orphans
            fi

            # ── 5. Clean up old dangling images to free disk space ───────────
            echo "🧹 Pruning dangling images..."
            sudo docker image prune -f

            # ── 6. Health check ──────────────────────────────────────────────
            echo "📊 Running containers:"
            sudo docker ps

            echo "✅ Presentation Coach deployed successfully to AWS EC2!"
