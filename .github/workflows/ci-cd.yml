name: Presentation Coach CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # Job 1: Lint and Run Pytest Suite
  # ==========================================================
  lint-and-test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt flake8

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Lint Code (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        env:
          MONGO_URI: mongodb://localhost:27017/presentation_coach_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          FLASK_ENV: testing
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=pytest-results.xml

      - name: Upload Test Results and Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-and-coverage-reports
          path: |
            coverage.xml
            htmlcov/
            pytest-results.xml

  # ==========================================================
  # Job 2: Build Multi-Stage Docker Images
  # ==========================================================
  build-docker:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Docker Hub Credentials
        id: docker_auth_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
          else
            echo "has_auth=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub (Conditional)
        if: steps.docker_auth_check.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: backend-prod
          push: ${{ steps.docker_auth_check.outputs.has_auth == 'true' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/presentation-coach-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/presentation-coach-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: ${{ steps.docker_auth_check.outputs.has_auth == 'true' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/presentation-coach-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/presentation-coach-frontend:${{ github.sha }}

  # ==========================================================
  # Job 3: Automated Deployment (Staging / Production)
  # ==========================================================
  deploy:
    name: Deploy Application
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Announce Deployment
        run: |
          echo "🚀 Deploying Presentation Coach to target environment..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

      - name: Execute Deployment Step (Placeholder / Webhook)
        run: |
          echo "✅ Application successfully staged for deployment."
          echo "Triggering cloud platform webhooks (Render / Vercel)..."
